[package]
name = "persian-calendar"
version = "1.0.0"
description = "تقویم شمسی مینیمال برای ویندوز"
authors = ["PersianCalendar"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4", features = ["clock", "std"] }
ab_glyph = "0.2"
winreg = "0.55"

[profile.release]
# Thin LTO keeps release builds practical on developer machines while still
# producing a small, optimised binary (fat LTO made the final link take tens of
# minutes on this project's dependency tree).
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
